services:
  db:
    image: postgres:18-bookworm
    container_name: sportcorp_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sportcorp_net

  redis:
    image: redis:7-alpine
    container_name: sportcorp_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sportcorp_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sportcorp_backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BACKEND_PORT}:4000"
    volumes:
      - ./backend/src:/app/src
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sportcorp_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sportcorp_worker
    restart: unless-stopped
    env_file: .env
    command: ["npm", "run", "worker"]
    volumes:
      - ./backend/src:/app/src
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sportcorp_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sportcorp_frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    networks:
      - sportcorp_net

volumes:
  postgres_data:
  uploads_data:

networks:
  sportcorp_net:
    driver: bridge
